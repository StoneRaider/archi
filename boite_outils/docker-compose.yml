# Boite a outils d'Archi : tout tourne dans Docker, sur le PC seulement (127.0.0.1), sauf l'Oeil qui peut avoir
# une porte vers Internet (porte + tunnel Cloudflare) pour l'appli telephone : voir LISEZ-MOI.txt.
#
# Lancer : lancer_archi.bat (a la racine du depot). A la main, depuis ce dossier :
#   docker compose --env-file ../.env up -d                        -> SearXNG + Presenton
#   docker compose --env-file ../.env --profile oeil up -d --build -> + le globe, sa porte et le relais (gods-eye-view requis)
#   docker compose --env-file ../.env --profile tunnel up -d       -> + le tunnel Cloudflare (TUNNEL_TOKEN requis)
#
# CLES : chaque service ne recoit QUE les variables dont il a besoin (jamais tout le .env : le jeton Telegram,
# la cle du telephone ou les codes des cameras n'entrent dans aucun conteneur).
services:

  searxng:
    image: searxng/searxng:latest
    container_name: archi_searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng   # SearXNG y cree sa config au premier lancement
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/

  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: archi_presenton
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:80"
    volumes:
      - ./presenton_data:/app_data
    environment:
      - LLM=${LLM:-custom}
      - CUSTOM_LLM_URL=${CUSTOM_LLM_URL:-http://host.docker.internal:1234/v1}
      - CUSTOM_MODEL=${CUSTOM_MODEL:-openai/gpt-oss-20b}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  oeil:
    # gods-eye-view (licence MIT) : le globe. Son code va dans le dossier gods-eye-view\ a cote de ce fichier.
    # Version COMPILEE (vite build + vite preview), recompilee a chaque demarrage (15 s) pour prendre les cles ;
    # si la compilation rate, il repart en mode developpement.
    profiles: ["oeil"]
    build: ./gods-eye-view
    container_name: archi_oeil
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
      # le relais d'images partage le reseau de l'oeil (voir « relais ») : son port se declare ici
      - "127.0.0.1:4174:4174"
    environment:
      - PORT=4173
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - MAPILLARY_CLIENT_TOKEN=${MAPILLARY_CLIENT_TOKEN:-}
      - CCTV_SOURCES_FILE=${CCTV_SOURCES_FILE:-}
    command: >
      sh -c "npx vite build || echo 'COMPILATION RATEE : mode developpement';
             if [ -f dist/index.html ]; then exec npx vite preview --host 0.0.0.0 --port 4173 --strictPort;
             else exec node scripts/docker-start.mjs; fi"

  porte:
    # La porte de l'oeil : seule entree depuis Internet vers le globe (billet signe -> cookie, en-tetes retires).
    profiles: ["oeil"]
    build:
      context: ./porte_oeil
    container_name: archi_porte_oeil
    restart: unless-stopped
    environment:
      - OEIL_URL=http://oeil:4173
      - OEIL_HOTE=127.0.0.1:4173
      - ARCHI_CLE_OEIL=${ARCHI_CLE_OEIL:-}
    depends_on:
      - oeil

  tunnel:
    # Le tunnel Cloudflare : https://oeil.ton-domaine -> porte:4175. Seul TUNNEL_TOKEN entre dans ce conteneur.
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: archi_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - porte

  relais:
    # Relais d'images : adresse fixe pour des webcams PUBLIQUES officielles (relais_cams/sources.json). Lecture seule.
    # Il partage le reseau du conteneur de l'oeil : « http://127.0.0.1:4174/cam/... » marche aussi depuis le globe.
    profiles: ["oeil"]
    build: ./relais_cams
    environment:
      - RELAIS_SOURCES=/app/config/sources.json
    volumes:
      - ./relais_cams:/app/config:ro   # le DOSSIER (pas le fichier : un fichier absent deviendrait un dossier)
    container_name: archi_relais_cams
    restart: unless-stopped
    network_mode: "service:oeil"
    depends_on:
      - oeil
