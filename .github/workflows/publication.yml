# Fabrique ce que l'on telecharge sur la page Releases : Archi-<version>.zip (le depot + l'appli deja compilee)
# et Archi.apk. Se lance quand on pousse une etiquette « v1.0 », ou a la main.
name: Publication (ZIP a telecharger)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pas de secret ni de donnee perso dans ce qui est publie
        run: python outils_depot/verifier_depot.py .
      - name: Tests du coeur et du portail
        run: node --test "core/test/*.test.js" "portail/test/*.test.js"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: "Fabriquer l'appli Android, signee par la cle stable (aucune cle d'Archi dedans : elle se branche par QR code)"
        working-directory: appli
        env:
          CLE_B64: ${{ secrets.ARCHI_CLE_B64 }}
          ARCHI_CLE_MDP: ${{ secrets.ARCHI_CLE_MDP }}
        run: |
          if [ -n "$CLE_B64" ]; then
            echo "$CLE_B64" | base64 -d > "$RUNNER_TEMP/archi-release.jks"
            export ARCHI_CLE_FICHIER="$RUNNER_TEMP/archi-release.jks"
          else
            echo "::warning::Secret ARCHI_CLE_B64 absent : APK signe avec une cle debug jetable (voir appli/SIGNATURE.md)"
          fi
          chmod +x gradlew && ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/archi-release.jks"
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"
      - name: Fabriquer le ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="essai" ;; esac
          python outils_depot/faire_le_zip.py --version "$VERSION" --apk appli/app/build/outputs/apk/release/app-release.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: archi-zip
          path: dist/*
      - name: Publier sur la page Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Archi-*.zip dist/Archi.apk \
            --title "Archi ${GITHUB_REF_NAME#v}" \
            --notes "Telecharge le ZIP, extrais-le, puis double-clique sur installation.bat. Le detail est dans le README."
