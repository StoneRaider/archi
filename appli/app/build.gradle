plugins {
    id 'com.android.application'
}

android {
    namespace = 'fr.archi.telephone'
    compileSdk = 36

    defaultConfig {
        // nom interne de la version publique. Il differe du nom des classes Java (namespace) :
        // deux applis Archi peuvent ainsi vivre cote a cote sur un telephone, sans que l'une ecrase l'autre.
        // Le meme nom est ecrit dans AndroidManifest.xml, Fichiers.java et portail/telephone.html (un test le verifie).
        applicationId = 'fr.archi.local'
        minSdk = 26
        targetSdk = 36
        versionCode = 15
        versionName = '5.7'
    }

    // Signature de la version a distribuer (assembleRelease) : une cle STABLE, gardee hors du depot.
    // Elle est donnee par 4 variables d'environnement (sur GitHub : les secrets du depot, voir appli/SIGNATURE.md).
    // Sans elles (copie du depot chez quelqu'un d'autre), la version release est signee avec la cle debug
    // de la machine : elle s'installe, mais une mise a jour signee par une autre cle sera refusee par Android.
    def cleFichier = System.getenv('ARCHI_CLE_FICHIER')
    def cleOk = cleFichier && file(cleFichier).isFile()
    signingConfigs {
        if (cleOk) {
            stable {
                storeFile = file(cleFichier)
                storePassword = System.getenv('ARCHI_CLE_MDP')
                keyAlias = System.getenv('ARCHI_CLE_ALIAS') ?: 'archi'
                keyPassword = System.getenv('ARCHI_CLE_MDP_ALIAS') ?: System.getenv('ARCHI_CLE_MDP')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = cleOk ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
